name: flutter_lab
description: An interactive, cross-platform showcase of Flutter capabilities.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flame: ^1.38.2
  audioplayers: ^6.1.0
  file_picker: ^10.3.10
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  share_plus: ^11.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.3.0
  path_provider: ^2.1.5
  sensors_plus: ^6.1.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/flame/
