name: Cross-platform builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-lab-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  android:
    name: Android release APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=flutterlab --org=com.jarrlyyy .
      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              path = Path(name)
              if not path.exists():
                  continue
              content = path.read_text()
              content = content.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              content = content.replace("compileSdk flutter.compileSdkVersion", "compileSdk 36")
              path.write_text(content)
          PY
          grep -R "compileSdk" android/app/build.gradle*
      - name: Declare Android notification permission
        run: sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
      - name: Set Android app label
        run: sed -i 's/android:label="flutterlab"/android:label="Flutter Lab"/' android/app/src/main/AndroidManifest.xml
      - name: Enable Android core library desugaring
        run: |
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lab-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows desktop release
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows project
        run: flutter create --platforms=windows --project-name=flutterlab --org=com.jarrlyyy .
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath flutter-lab-windows.zip
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lab-windows
          path: flutter-lab-windows.zip
          if-no-files-found: error
          retention-days: 7
