name: Import Kenney platformer assets

on:
  push:
    branches: [feature/flame-platformer-game]
    paths:
      - ".github/workflows/import-flame-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flame-platformer-game
          persist-credentials: true

      - name: Download Kenney Platformer Art Deluxe
        run: |
          set -euo pipefail
          mkdir -p /tmp/kenney assets/images/flame
          curl --fail --location --retry 4 --retry-delay 2 \
            --user-agent "Mozilla/5.0 (compatible; FlutterLabAssetImporter/1.0)" \
            "https://opengameart.org/sites/default/files/platformerGraphicsDeluxe_Updated.zip" \
            --output /tmp/kenney/platformer.zip
          unzip -q /tmp/kenney/platformer.zip -d /tmp/kenney/unpacked

      - name: Select and copy game sprites
        run: |
          set -euo pipefail
          copy_asset() {
            local source_name="$1"
            local target_name="$2"
            local found
            found="$(find /tmp/kenney/unpacked -type f -iname "$source_name" -print -quit)"
            if [ -z "$found" ]; then
              echo "Required asset not found: $source_name"
              find /tmp/kenney/unpacked -type f | head -80
              exit 1
            fi
            cp "$found" "assets/images/flame/$target_name"
          }

          copy_asset "p1_stand.png" "player.png"
          copy_asset "p1_walk01.png" "player_walk_1.png"
          copy_asset "p1_walk02.png" "player_walk_2.png"
          copy_asset "p1_jump.png" "player_jump.png"
          copy_asset "coinGold.png" "coin.png"
          copy_asset "slimeWalk1.png" "slime.png"
          copy_asset "grassMid.png" "ground.png"

          cat > assets/images/flame/ASSET_CREDITS.md <<'EOF'
          # Game asset credits

          Character, coin, slime and terrain sprites are from Kenney's
          Platformer Art Deluxe pack.

          Source: https://kenney.nl/assets/platformer-art-deluxe
          License: Creative Commons CC0 (public domain dedication).
          EOF

      - name: Commit assets and remove this temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/import-flame-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/flame .github/workflows/import-flame-assets.yml
          git commit -m "Add Kenney CC0 platformer sprites"
          git push origin HEAD:feature/flame-platformer-game
